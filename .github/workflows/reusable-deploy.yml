name: Deploy workflow

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      scp_local:
        type: string
        required: true
      scp_remote:
        type: string
        required: true
    secrets:
      SERVER_HOST:
        required: true
      SERVER_USERNAME:
        required: true
      SERVER_KEY:
        required: true
      SERVER_PORT:
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy compose file to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: ${{ inputs.scp_local }}
          target: ${{ inputs.scp_remote }}
          strip_components: 1

      - name: Restart containers and verify health
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd "${{ inputs.scp_remote }}"
            test -f .env || { echo "ERROR: ${{ inputs.scp_remote }}/.env is missing"; exit 1; }
            chmod 600 .env

            sudo docker compose --env-file .env -f docker-compose-server.yaml pull
            sudo docker compose --env-file .env -f docker-compose-server.yaml up -d --remove-orphans

            for attempt in $(seq 1 30); do
              if curl -fsS http://localhost:8080/api/v1/actuator/health | grep -q '"status":"UP"'; then
                echo "Backend is healthy"
                exit 0
              fi
              sleep 5
            done

            echo "Backend health check failed"
            sudo docker compose --env-file .env -f docker-compose-server.yaml ps
            sudo docker compose --env-file .env -f docker-compose-server.yaml logs --tail=200 backend
            exit 1
