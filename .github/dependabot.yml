version: 2

updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns:
          - 'org.springframework*'
          - 'io.jsonwebtoken*'
      test:
        patterns:
          - 'org.junit*'
          - 'org.mockito*'
          - 'org.assertj*'
    labels:
      - dependencies
      - backend

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Moscow
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: /security-service
    schedule:
      interval: weekly
      day: monday
      time: '05:10'
      timezone: Europe/Moscow
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
