# Локальная разработка. Пароли и JWT_SECRET берутся из окружения (.env).
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/edm}
spring.datasource.username=${DATABASE_USERNAME:edm}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

security.jwt.secret=${JWT_SECRET}
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

minio.config.public-endpoint=${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}

logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
