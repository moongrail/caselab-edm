spring.application.name=caselab-edm
server.servlet.context-path=/api/v1
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
server.forward-headers-strategy=framework

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false
spring.liquibase.change-log=classpath:liquibase/db.master.xml
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2

# Секреты не хранятся в репозитории: значения передаются через окружение
# или GitHub Secrets. Профиль обязан задать DATABASE_* и JWT_SECRET.
platform.security.jwt.secret=${JWT_SECRET}
platform.security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:1h}
platform.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
platform.security.public-paths=/actuator/health,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html,/swagger-resources/**,/error

security.service.url=${SECURITY_SERVICE_URL:http://localhost:8081/api/v1}
security.service.internal-token=${SECURITY_INTERNAL_TOKEN:}

platform.storage.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
platform.storage.minio.public-endpoint=${MINIO_PUBLIC_ENDPOINT:}
platform.storage.minio.access-key=${MINIO_ACCESS_KEY}
platform.storage.minio.secret-key=${MINIO_SECRET_KEY}
platform.storage.minio.bucket-name=${MINIO_BUCKET:documents}
platform.storage.minio.presigned-url-expiry=${MINIO_PRESIGNED_URL_EXPIRY:15m}
platform.storage.minio.initialize-bucket=${MINIO_INITIALIZE_BUCKET:true}
spring.elasticsearch.uris=${ELASTIC_ENDPOINT:http://localhost:9200}
spring.elasticsearch.username=${ELASTIC_USERNAME:}
spring.elasticsearch.password=${ELASTIC_PASSWORD:}
spring.elasticsearch.restclient.sniffer.interval=10m
spring.elasticsearch.restclient.sniffer.delay-after-failure=30s
spring.data.elasticsearch.repositories.enabled=true

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true

platform.search.reindex-on-startup=${ELASTIC_REINDEX_ON_STARTUP:false}
app.openapi.server-url=${OPENAPI_SERVER_URL:http://localhost:8080/api/v1}
# Bootstrap первичного администратора выполняет security-service:
# см. app.bootstrap.admin.* и BOOTSTRAP_ADMIN_* в его конфигурации.

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.elasticsearch.enabled=false
management.health.mail.enabled=false

logging.level.root=INFO
logging.level.ru.caselab.edm.backend=INFO
