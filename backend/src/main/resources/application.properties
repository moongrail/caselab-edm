spring.application.name=caselab-edm
server.servlet.context-path=/api/v1
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
server.forward-headers-strategy=framework

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false
spring.liquibase.change-log=classpath:liquibase/db.master.xml
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2

# Секреты не хранятся в репозитории: значения передаются через окружение
# или GitHub Secrets. Профиль обязан задать DATABASE_* и JWT_SECRET.
security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:1h}
security.jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:30d}
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

minio.config.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.config.public-endpoint=${MINIO_PUBLIC_ENDPOINT:}
minio.config.username=${MINIO_ACCESS_KEY}
minio.config.password=${MINIO_SECRET_KEY}
minio.config.bucket-name=${MINIO_BUCKET:documents}
minio.config.presigned-url-expiry=${MINIO_PRESIGNED_URL_EXPIRY:15m}

spring.elasticsearch.uris=${ELASTIC_ENDPOINT:http://localhost:9200}
spring.elasticsearch.username=${ELASTIC_USERNAME:}
spring.elasticsearch.password=${ELASTIC_PASSWORD:}
spring.elasticsearch.restclient.sniffer.interval=10m
spring.elasticsearch.restclient.sniffer.delay-after-failure=30s
spring.data.elasticsearch.repositories.enabled=true

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true

app.elasticsearch.reindex-on-startup=${ELASTIC_REINDEX_ON_STARTUP:false}
app.minio.initialize-bucket=${MINIO_INITIALIZE_BUCKET:true}
app.openapi.server-url=${OPENAPI_SERVER_URL:http://localhost:8080/api/v1}

# Первичный администратор создаётся только при явном включении.
# Пароль задаётся через BOOTSTRAP_ADMIN_PASSWORD и нигде не хранится.
app.bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.admin.login=${BOOTSTRAP_ADMIN_LOGIN:}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin.first-name=${BOOTSTRAP_ADMIN_FIRST_NAME:Администратор}
app.bootstrap.admin.last-name=${BOOTSTRAP_ADMIN_LAST_NAME:Системы}
app.bootstrap.admin.position=${BOOTSTRAP_ADMIN_POSITION:Administrator}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.elasticsearch.enabled=false
management.health.mail.enabled=false

logging.level.root=INFO
logging.level.ru.caselab.edm.backend=INFO
