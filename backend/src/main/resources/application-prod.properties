# Production. Do not put credentials here; provide them through CI secrets.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

platform.security.jwt.secret=${JWT_SECRET}
platform.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
platform.storage.minio.public-endpoint=${MINIO_PUBLIC_ENDPOINT}
platform.search.reindex-on-startup=${ELASTIC_REINDEX_ON_STARTUP:false}

security.service.url=${SECURITY_SERVICE_URL}
security.service.internal-token=${SECURITY_INTERNAL_TOKEN}

spring.mail.host=${MAIL_HOST}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

logging.level.root=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
