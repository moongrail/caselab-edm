# Production. Все секреты обязательны и передаются через окружение/секреты CI.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

security.jwt.secret=${JWT_SECRET}
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

minio.config.public-endpoint=${MINIO_PUBLIC_ENDPOINT}

spring.mail.host=${MAIL_HOST}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

app.elasticsearch.reindex-on-startup=${ELASTIC_REINDEX_ON_STARTUP:false}

logging.level.root=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
