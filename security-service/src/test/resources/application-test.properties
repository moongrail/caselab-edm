spring.application.name=security-service
server.servlet.context-path=/api/v1
spring.datasource.url=jdbc:h2:mem:security;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:liquibase/db.master.xml

platform.security.jwt.secret=dGVzdC1zZWNyZXQtdmFsdWUtd2l0aC1hdC1sZWFzdC0zMi1ieXRlcw==
platform.security.public-paths=/auth,/jwt/update,/internal/**,/actuator/health,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html,/error
security.internal.token=test-internal-token
app.bootstrap.admin.enabled=false
logging.level.org.springframework.security=WARN
