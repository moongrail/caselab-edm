# Local profile. JWT_SECRET, SECURITY_INTERNAL_TOKEN and database credentials come from .env.
spring.datasource.url=${SECURITY_DATABASE_URL:jdbc:postgresql://localhost:5432/security}
spring.datasource.username=${SECURITY_DATABASE_USERNAME:security}
spring.datasource.password=${SECURITY_DATABASE_PASSWORD}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
platform.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
logging.level.org.springframework.security=INFO
