spring.application.name=security-service
server.servlet.context-path=/api/v1
server.port=${SERVER_PORT:8081}
server.shutdown=graceful
server.forward-headers-strategy=framework

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.liquibase.change-log=classpath:liquibase/db.master.xml
spring.datasource.url=${SECURITY_DATABASE_URL:jdbc:postgresql://localhost:5432/security}
spring.datasource.username=${SECURITY_DATABASE_USERNAME:security}
spring.datasource.password=${SECURITY_DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

platform.security.jwt.secret=${JWT_SECRET}
platform.security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:1h}
platform.security.jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:30d}
platform.security.public-paths=/auth,/jwt/update,/internal/**,/actuator/health,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html,/error
platform.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

security.internal.token=${SECURITY_INTERNAL_TOKEN:}
app.bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.admin.login=${BOOTSTRAP_ADMIN_LOGIN:}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin.first-name=${BOOTSTRAP_ADMIN_FIRST_NAME:Administrator}
app.bootstrap.admin.last-name=${BOOTSTRAP_ADMIN_LAST_NAME:System}
app.bootstrap.admin.position=${BOOTSTRAP_ADMIN_POSITION:Administrator}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
logging.level.root=INFO
logging.level.ru.caselab.edm.security=INFO
